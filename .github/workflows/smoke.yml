name: Smoke

on:
  pull_request:
    branches:
      - main

jobs:
  load:
    runs-on: ubuntu-latest
    # Make this required after it has passed consistently across several PRs.
    continue-on-error: true
    container: archlinux:latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Install Quickshell and sway
        run: |
          # ttf-material-symbols-variable: the bar renders its icons as text in the
          # "Material Symbols Rounded" family, and without it they measure as fallback
          # glyphs several times an icon's width rather than failing to draw.
          pacman -Syu --noconfirm pipewire quickshell qt6-5compat sway ttf-material-symbols-variable
          # Docker denies exec of Arch's capability-marked sway without SYS_NICE.
          setcap -r /usr/bin/sway
      - name: Test Wi-Fi password retry
        run: tests/network-password-retry.sh
      - name: Test optional DDC support
        run: tests/brightness-without-ddcutil.sh
      - name: Test brightness sync with external writers
        run: tests/brightness-external-sync.sh
      - name: Test wallpaper state and validation
        run: tests/wallpaper-service.sh
      - name: Test the dashboard geometry
        run: tests/dashboard-geometry.sh
      - name: Test dashboard destination motion
        run: tests/dashboard-transition.sh
      - name: Test the workspace indicator's width under a raised special
        run: tests/workspace-special-geometry.sh
      - name: Test wallpaper keyboard interactions
        run: tests/dashboard-wallpaper-interaction.sh
      - name: Test the lock screen clock
        run: tests/lock-clock.sh
      - name: Test the battery body's glyph in each power state
        run: tests/battery-body.sh
      - name: Test the battery indicator and its hover readout
        run: tests/battery-indicator.sh
      - name: Test the recording indicator against the recorder's state file
        run: tests/recording-indicator.sh
      - name: Test the lock status cluster without UPower
        run: tests/lock-status-cluster.sh
      - name: Test the lock screen power controls
        run: tests/lock-power-controls.sh
      - name: Test the lock screen password states
        run: tests/lock-auth-area.sh
      - name: Test the lock screen fingerprint affordance
        run: tests/lock-fingerprint.sh
      - name: Test the tooltip's metrics and placement
        run: tests/tooltip-geometry.sh
      - name: Load the shell
        env:
          WLR_BACKENDS: headless
          WLR_HEADLESS_OUTPUTS: "1"
          WLR_LIBINPUT_NO_DEVICES: "1"
          WLR_RENDERER: pixman
          XDG_RUNTIME_DIR: /tmp/quickshell-smoke-runtime
        run: |
          set -euo pipefail

          install -d -m 700 "$XDG_RUNTIME_DIR"
          pipewire >pipewire.log 2>&1 &
          pipewire_pid=$!
          sway --config /dev/null >sway.log 2>&1 &
          sway_pid=$!
          qs_pid=

          cleanup() {
            if [[ -n "$qs_pid" ]]; then
              kill "$qs_pid" 2>/dev/null || true
            fi
            kill "$sway_pid" 2>/dev/null || true
            kill "$pipewire_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          wayland_display=
          for _ in {1..50}; do
            wayland_display="$(find "$XDG_RUNTIME_DIR" -maxdepth 1 -type s -name 'wayland-*' -printf '%f\n' -quit)"
            if [[ -n "$wayland_display" && -S "$XDG_RUNTIME_DIR/pipewire-0" ]]; then
              break
            fi
            sleep 0.1
          done

          if [[ -z "$wayland_display" || ! -S "$XDG_RUNTIME_DIR/pipewire-0" ]]; then
            cat pipewire.log
            cat sway.log
            echo "The headless session did not become ready"
            exit 1
          fi
          export WAYLAND_DISPLAY="$wayland_display"

          tests/wallpaper-transition.sh
          tests/compact-notification-layout.sh
          tests/notification-group-collapsed.sh
          tests/control-center-panel-sizing.sh

          qs --no-color -p . >quickshell-startup.log 2>&1 &
          qs_pid=$!
          sleep 10

          qslog="$(find "$XDG_RUNTIME_DIR/quickshell" -type f -name log.qslog -print -quit 2>/dev/null || true)"
          if [[ -z "$qslog" ]]; then
            cat quickshell-startup.log
            echo "Quickshell did not create a qslog"
            exit 1
          fi

          qs log --no-color "$qslog" >quickshell.log
          cat quickshell.log

          # A binding loop is only a warning, so the shell still loads and every other gate
          # still passes while the looping property sits at null. It is never environmental
          # the way this container's absent DBus services are, so it fails the load.
          if grep -qE 'ERROR|Failed to load configuration|Binding loop detected' quickshell.log; then
            exit 1
          fi
